name: NHL Betting Screener

on:
  schedule:
    # Every 30 minutes, all day, offset to :07/:37 rather than :00/:30 -- GitHub documents
    # that scheduled triggers can be delayed under load, and the top of the hour/half-hour
    # is the most congested time on the platform since so many repos default to */30 or
    # */15. Found 2026-10-03 after a real 4-day outage: actual run timestamps showed gaps
    # of 3-7 hours instead of the intended 30 minutes, which (combined with a too-narrow
    # catch-window) meant the daily screening window was being missed almost every day --
    # see screener/nhl_schedule_gate.py's run_window_open for the other half of this fix
    # (a much wider window so a less-frequent or delayed tick still catches it).
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write   # needed to commit the updated dashboard + ledger back to the repo

jobs:
  run-nhl-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env file
        run: |
          echo "ODDS_API_KEY=${{ secrets.ODDS_API_KEY }}" >> .env
          echo "GMAIL_ADDRESS=${{ secrets.GMAIL_ADDRESS }}" >> .env
          echo "GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}" >> .env

      - name: Check run window and screen NHL if open
        run: python main.py --nhl-only --send

      - name: Commit updated dashboard, ledger, and run marker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html data/
          git diff --staged --quiet || git commit -m "Update dashboard and ledger [NHL automated run]"
          git pull --rebase origin main
          git push
