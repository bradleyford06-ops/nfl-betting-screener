name: NFL Betting Screener

on:
  schedule:
    - cron: '0 13 * * *'   # 13:00 UTC daily = 9AM ET / 6AM PT — odds shift throughout the week now, not just Mon/Wed/Fri/Sat
  workflow_dispatch:

permissions:
  contents: write   # needed to commit the updated dashboard + ledger back to the repo

jobs:
  run-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env file
        run: |
          echo "ODDS_API_KEY=${{ secrets.ODDS_API_KEY }}" >> .env
          echo "GMAIL_ADDRESS=${{ secrets.GMAIL_ADDRESS }}" >> .env
          echo "GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}" >> .env

      - name: Run screener
        run: python main.py --send

      - name: Commit updated dashboard and ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html data/ledger.db
          git diff --staged --quiet || git commit -m "Update dashboard and ledger [automated run]"
          git push
